name: Catalog static checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      audit_production:
        description: "Run a read-only audit against the deployed public catalog"
        required: false
        type: boolean
        default: false
      audit_personal_experience:
        description: "Run a read-only audit against Declaraci-n using the Personal Experience QA profile"
        required: false
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm package downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-playwright-1.64.1-axe-4.14.0
          restore-keys: |
            ${{ runner.os }}-npm-playwright-

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.64.1
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Chromium for mobile layout tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.64.1 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium

      - name: Check syntax of all tracked JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            case "$file" in
              functions/api/*|functions/_shared/*|api/share.js)
                node --input-type=module --check < "$file"
                ;;
              *)
                node --check "$file"
                ;;
            esac
            count=$((count + 1))
          done < <(git ls-files -z '*.js')
          echo "JavaScript syntax check passed for $count tracked .js files."
      - name: Check syntax of all tracked JavaScript module files
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            echo "Checking module $file"
            node --check "$file"
            count=$((count + 1))
          done < <(git ls-files -z '*.mjs')
          echo "JavaScript module syntax check passed for $count tracked .mjs files."
      - name: Guard cache keys when browser assets change
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA:-}" ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          python tests/cache-key-change-guard.py "$BASE_SHA" "$GITHUB_SHA"

      - name: Verify regression runner inventory
        run: node --test tests/regression-runner-contract.test.mjs

      - name: Test AI visual review parser, schema and reliability safeguards
        run: node --test tests/ai-visual-review-utils.test.mjs tests/ai-reviewer-reliability.test.mjs

      - name: Run automated regression suite in parallel groups
        env:
          TEST_GROUP_CONCURRENCY: "2"
        run: node tests/run-regression-suite.mjs

      - name: Check canonical URLs and public share origin
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          root = Path(".")
          required = {
              "config.js": 'publicCatalogUrl: "https://jb-collections.pages.dev"',
              "index.html": 'href="https://jb-collections.pages.dev/"',
              "tecnologia/index.html": 'href="https://jb-collections.pages.dev/tecnologia/"',
              "perfumeria/index.html": 'href="https://jb-collections.pages.dev/perfumeria/"',
              "functions/api/share.js": "export async function onRequest",
          }
          errors = []
          for filename, needle in required.items():
              content = (root / filename).read_text(encoding="utf-8")
              if needle not in content:
                  errors.append(f"{filename}: required configuration missing: {needle}")
          for filename in ("tecnologia/index.html", "perfumeria/index.html", "perfumeria.html"):
              if "jasbh121101.github.io/Cat-logo/" in (root / filename).read_text(encoding="utf-8"):
                  errors.append(f"{filename}: old GitHub Pages URL remains")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("Public URL, canonical links, and Cloudflare Functions entry point are consistent.")
          PY

      - name: Check HTML IDs and local references
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import posixpath
          import sys

          root = Path(".")
          failures = []

          class Checker(HTMLParser):
              def __init__(self, filename):
                  super().__init__(convert_charrefs=True)
                  self.filename = filename
                  self.ids = set()

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  element_id = attrs.get("id")
                  if element_id:
                      if element_id in self.ids:
                          failures.append(f"{self.filename}: duplicate id={element_id!r}")
                      self.ids.add(element_id)

                  for attribute in ("src", "href", "poster"):
                      value = attrs.get(attribute)
                      if not value:
                          continue
                      value = value.strip()
                      if (value.startswith("#") or value.startswith("//")
                              or value.startswith("/") or value.startswith("data:")):
                          continue
                      parsed = urlsplit(value)
                      if parsed.scheme or parsed.netloc:
                          continue
                      relative = parsed.path
                      if not relative:
                          continue
                      base = str(self.filename.parent / relative)
                      resolved = Path(posixpath.normpath(base))
                      if relative.endswith("/") or (resolved.exists() and resolved.is_dir()):
                          resolved = resolved / "index.html"
                      if not resolved.exists():
                          failures.append(
                              f"{self.filename}: {attribute}={value!r} resolves to missing {resolved}"
                          )

          html_files = sorted(root.rglob("*.html"))
          for filename in html_files:
              checker = Checker(filename)
              try:
                  checker.feed(filename.read_text(encoding="utf-8"))
                  checker.close()
              except Exception as exc:
                  failures.append(f"{filename}: HTML parse error: {exc}")

          if failures:
              print("\\n".join(failures))
              sys.exit(1)
          print(f"Checked {len(html_files)} HTML files: no duplicate IDs or missing relative references.")
          PY
      - name: Map source dependencies and report possible dead code
        shell: bash
        run: |
          set -euo pipefail
          python tests/dependency-audit.py --output dependency-audit.md --summary "$GITHUB_STEP_SUMMARY"

      - name: Check CSS block delimiters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          failures = []
          css_files = sorted(Path(".").rglob("*.css"))
          for path in css_files:
              text = path.read_text(encoding="utf-8")
              depth = 0
              state = "code"
              i = 0
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""
                  if state == "comment":
                      if c == "*" and n == "/":
                          state = "code"
                          i += 2
                          continue
                      i += 1
                      continue
                  if state in ("single", "double"):
                      end = "'" if state == "single" else '"'
                      if c == "\\\\":
                          i += 2
                          continue
                      if c == end:
                          state = "code"
                      i += 1
                      continue
                  if c == "/" and n == "*":
                      state = "comment"
                      i += 2
                      continue
                  if c == "'":
                      state = "single"
                  elif c == '"':
                      state = "double"
                  elif c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth < 0:
                          failures.append(f"{path}: unexpected closing brace at offset {i}")
                          break
                  i += 1
              if depth != 0 or state != "code":
                  failures.append(f"{path}: unbalanced CSS blocks/quotes (depth={depth}, state={state})")

          if failures:
              print("\\n".join(failures))
              sys.exit(1)
          print(f"Checked {len(css_files)} CSS files: braces and quoted strings are balanced.")
          PY

      - name: Check unique Supabase migration versions
        shell: bash
        run: |
          python - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import re
          import sys

          versions = defaultdict(list)
          for path in sorted(Path("supabase/migrations").glob("*.sql")):
              match = re.match(r"^(\d{14})_", path.name)
              if not match:
                  print(f"{path}: migration filename must start with a 14-digit version")
                  sys.exit(1)
              versions[match.group(1)].append(path.name)

          duplicates = {version: names for version, names in versions.items() if len(names) > 1}
          if duplicates:
              for version, names in duplicates.items():
                  print(f"Duplicate migration version {version}: {', '.join(names)}")
              sys.exit(1)
          print(f"Checked {sum(map(len, versions.values()))} migrations: all version identifiers are unique.")
          PY

      - name: Upload admin quality audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-quality-audit
          path: admin-quality-audit.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload regression audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-audit-report
          path: |
            regression-audit-report.md
            regression-audit-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload visual audit report and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit-evidence
          path: |
            visual-audit-report.md
            visual-audit-report.json
            artifacts/visual-audit/*.png
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          overwrite: false
          include-hidden-files: false

  production-visual-audit:
    name: Read-only production visual audit
    # Runs independently so commerce-test failures do not suppress visual evidence.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.audit_production) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    env:
      AI_REVIEW_ENABLED: ${{ vars.ENABLE_AI_VISUAL_REVIEW == 'true' && ((secrets.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_ACCOUNT_ID != '') || secrets.OPENAI_API_KEY != '') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.64.1 sharp@0.35.5
          npx playwright install --with-deps chromium
      - name: Audit live public pages without writing data
        env:
          VISUAL_AUDIT_BASE_URL: https://jb-collections.pages.dev
        run: node tests/production-readonly-visual-audit.mjs
      - name: Review production screenshots with configured AI providers
        if: ${{ env.AI_REVIEW_ENABLED == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL || 'gpt-5.4-mini' }}
          AI_PROVIDER_ORDER: ${{ vars.AI_PROVIDER_ORDER || 'cloudflare,openai' }}
        run: node tests/ai-visual-review.mjs
      - name: Record that model review is not configured
        if: ${{ env.AI_REVIEW_ENABLED != 'true' }}
        shell: bash
        run: |
          mkdir -p artifacts/production-visual-audit
          cat > artifacts/production-visual-audit/ai-visual-review-status.md <<'EOF'
          # AI visual review
          
          Status: not run.
          
          To enable optional screenshot review, configure the repository secret `OPENAI_API_KEY`, or configure both `CLOUDFLARE_ACCOUNT_ID` and `CLOUDFLARE_API_TOKEN`. The static browser audit will still run without AI credentials. No screenshot is sent to an AI service unless at least one provider is configured.
          EOF
      - name: Upload production audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-visual-audit-evidence
          path: artifacts/production-visual-audit/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

  personal-experience-audit:
    name: Read-only personal experience QA
    # Intentionally independent from ecommerce regression checks.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.audit_personal_experience }}
    runs-on: ubuntu-latest
    env:
      AI_REVIEW_ENABLED: ${{ vars.ENABLE_AI_VISUAL_REVIEW == 'true' && ((secrets.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_ACCOUNT_ID != '') || secrets.OPENAI_API_KEY != '') }}
      EXPERIENCE_AUDIT_URL: https://jasbh121101.github.io/Declaraci-n/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser and accessibility tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.64.1 @axe-core/playwright@4.14.0 sharp@0.35.5
          npx playwright install --with-deps chromium
      - name: Run the interactive experience in a read-only browser
        run: node tests/personal-experience-qa.mjs
      - name: Review experience screenshots with configured AI providers
        if: ${{ env.AI_REVIEW_ENABLED == 'true' }}
        env:
          QA_PROFILE: personal-experience
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL || 'gpt-5.4-mini' }}
          AI_PROVIDER_ORDER: ${{ vars.AI_PROVIDER_ORDER || 'cloudflare,openai' }}
        run: node tests/ai-visual-review.mjs
      - name: Generate an evidence-only scorecard when AI review is not configured
        if: ${{ env.AI_REVIEW_ENABLED != 'true' }}
        env:
          QA_PROFILE: personal-experience
        run: node tests/ai-visual-review.mjs
      - name: Upload personal experience QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-experience-qa-evidence
          path: |
            artifacts/production-visual-audit/personal-experience-qa-report.json
            artifacts/production-visual-audit/personal-experience-qa-report.md
            artifacts/production-visual-audit/experience-qa-evaluation.json
            artifacts/production-visual-audit/experience-qa-evaluation.md
            artifacts/production-visual-audit/ai-visual-review-report.json
            artifacts/production-visual-audit/ai-visual-review-report.md
            artifacts/production-visual-audit/ai-visual-review-status.json
            artifacts/production-visual-audit/ai-visual-review-status.md
            artifacts/production-visual-audit/experience--*.png
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
