name: Catalog static checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium for mobile layout tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: Check syntax of all tracked JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            case "$file" in
              functions/api/*|functions/_shared/*|api/share.js)
                node --input-type=module --check < "$file"
                ;;
              *)
                node --check "$file"
                ;;
            esac
            count=$((count + 1))
          done < <(git ls-files -z '*.js')
          echo "JavaScript syntax check passed for $count tracked .js files."
      - name: Guard cache keys when browser assets change
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA:-}" ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          python tests/cache-key-change-guard.py "$BASE_SHA" "$GITHUB_SHA"

      - name: Run automated regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/cache-key-change-guard.test.mjs
          node --test tests/dependency-audit.test.mjs
          node --test tests/migration-history-hygiene.test.mjs
          node --test tests/private-chat-mobile-layout.test.mjs
          node --test tests/private-chat-state-behavior.test.mjs
          node --test tests/ai-assistant-layout.test.mjs
          node --test tests/catalog-specifications-format.test.mjs
          node --test tests/public-commercial-readiness.test.mjs
          node --test tests/conversion-trust.test.mjs
          node --test tests/design-authenticity-audit.test.mjs
          node --test tests/design-quality-audit.test.mjs
          node --test tests/admin-notifications.test.mjs
          node --test tests/admin-panel-quality-audit.test.mjs
          node --test tests/admin-save-regression.test.mjs
          node --test tests/admin-product-form-workflow.test.mjs
          node --test tests/limited-edition-sections.test.mjs
          node --experimental-default-type=module --test tests/cloudflare-share.test.mjs
          node --experimental-default-type=module --test tests/cloudflare-download.test.mjs
          node --experimental-default-type=module --test tests/cloudflare-private-chat-push.test.mjs
          node --experimental-default-type=module --test tests/web-push.test.mjs
          node --experimental-default-type=module --test tests/cloudflare-assistant.test.mjs
          node --experimental-default-type=module --test tests/cloudflare-color-assistant.test.mjs
          node --test tests/admin-color-assistant.test.mjs
          node --test tests/admin-mobile-menu-stability.test.mjs
          node --test tests/admin-provider-price-sync.test.mjs
          node --test tests/provider-review-variants.test.mjs
          node --test tests/perfume-card-layout.test.mjs
          node --test tests/commercial-description-layout.test.mjs
          node --test tests/catalog-contact-channels.test.mjs
          node --test tests/private-chat-workflow.test.mjs
          node --test tests/private-chat-resume.test.mjs
          node --test tests/product-tag-formatting.test.mjs
          node --test tests/asset-cache-contract.test.mjs
          node --experimental-default-type=module --test tests/technology-gallery-layout.test.mjs
          node --test tests/technology-subcategory-filter.test.mjs

      - name: Check canonical URLs and public share origin
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          root = Path(".")
          required = {
              "config.js": 'publicCatalogUrl: "https://jb-collections.pages.dev"',
              "index.html": 'href="https://jb-collections.pages.dev/"',
              "tecnologia/index.html": 'href="https://jb-collections.pages.dev/tecnologia/"',
              "perfumeria/index.html": 'href="https://jb-collections.pages.dev/perfumeria/"',
              "functions/api/share.js": "export async function onRequest",
          }
          errors = []
          for filename, needle in required.items():
              content = (root / filename).read_text(encoding="utf-8")
              if needle not in content:
                  errors.append(f"{filename}: required configuration missing: {needle}")
          for filename in ("tecnologia/index.html", "perfumeria/index.html", "perfumeria.html"):
              if "jasbh121101.github.io/Cat-logo/" in (root / filename).read_text(encoding="utf-8"):
                  errors.append(f"{filename}: old GitHub Pages URL remains")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("Public URL, canonical links, and Cloudflare Functions entry point are consistent.")
          PY

      - name: Check HTML IDs and local references
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import posixpath
          import sys

          root = Path(".")
          failures = []

          class Checker(HTMLParser):
              def __init__(self, filename):
                  super().__init__(convert_charrefs=True)
                  self.filename = filename
                  self.ids = set()

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  element_id = attrs.get("id")
                  if element_id:
                      if element_id in self.ids:
                          failures.append(f"{self.filename}: duplicate id={element_id!r}")
                      self.ids.add(element_id)

                  for attribute in ("src", "href", "poster"):
                      value = attrs.get(attribute)
                      if not value:
                          continue
                      value = value.strip()
                      if (value.startswith("#") or value.startswith("//")
                              or value.startswith("/") or value.startswith("data:")):
                          continue
                      parsed = urlsplit(value)
                      if parsed.scheme or parsed.netloc:
                          continue
                      relative = parsed.path
                      if not relative:
                          continue
                      base = str(self.filename.parent / relative)
                      resolved = Path(posixpath.normpath(base))
                      if relative.endswith("/") or (resolved.exists() and resolved.is_dir()):
                          resolved = resolved / "index.html"
                      if not resolved.exists():
                          failures.append(
                              f"{self.filename}: {attribute}={value!r} resolves to missing {resolved}"
                          )

          html_files = sorted(root.rglob("*.html"))
          for filename in html_files:
              checker = Checker(filename)
              try:
                  checker.feed(filename.read_text(encoding="utf-8"))
                  checker.close()
              except Exception as exc:
                  failures.append(f"{filename}: HTML parse error: {exc}")

          if failures:
              print("\\n".join(failures))
              sys.exit(1)
          print(f"Checked {len(html_files)} HTML files: no duplicate IDs or missing relative references.")
          PY
      - name: Map source dependencies and report possible dead code
        shell: bash
        run: |
          set -euo pipefail
          python tests/dependency-audit.py --output dependency-audit.md --summary "$GITHUB_STEP_SUMMARY"

      - name: Check CSS block delimiters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          failures = []
          css_files = sorted(Path(".").rglob("*.css"))
          for path in css_files:
              text = path.read_text(encoding="utf-8")
              depth = 0
              state = "code"
              i = 0
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""
                  if state == "comment":
                      if c == "*" and n == "/":
                          state = "code"
                          i += 2
                          continue
                      i += 1
                      continue
                  if state in ("single", "double"):
                      end = "'" if state == "single" else '"'
                      if c == "\\\\":
                          i += 2
                          continue
                      if c == end:
                          state = "code"
                      i += 1
                      continue
                  if c == "/" and n == "*":
                      state = "comment"
                      i += 2
                      continue
                  if c == "'":
                      state = "single"
                  elif c == '"':
                      state = "double"
                  elif c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth < 0:
                          failures.append(f"{path}: unexpected closing brace at offset {i}")
                          break
                  i += 1
              if depth != 0 or state != "code":
                  failures.append(f"{path}: unbalanced CSS blocks/quotes (depth={depth}, state={state})")

          if failures:
              print("\\n".join(failures))
              sys.exit(1)
          print(f"Checked {len(css_files)} CSS files: braces and quoted strings are balanced.")
          PY

      - name: Check unique Supabase migration versions
        shell: bash
        run: |
          python - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import re
          import sys

          versions = defaultdict(list)
          for path in sorted(Path("supabase/migrations").glob("*.sql")):
              match = re.match(r"^(\d{14})_", path.name)
              if not match:
                  print(f"{path}: migration filename must start with a 14-digit version")
                  sys.exit(1)
              versions[match.group(1)].append(path.name)

          duplicates = {version: names for version, names in versions.items() if len(names) > 1}
          if duplicates:
              for version, names in duplicates.items():
                  print(f"Duplicate migration version {version}: {', '.join(names)}")
              sys.exit(1)
          print(f"Checked {sum(map(len, versions.values()))} migrations: all version identifiers are unique.")
          PY

      - name: Upload admin quality audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-quality-audit
          path: admin-quality-audit.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.md
          if-no-files-found: ignore
          retention-days: 14
