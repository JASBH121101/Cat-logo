name: Catalog static checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check availability of Android signing secrets without revealing values
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set +x
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_DEBUG_KEYSTORE_BASE64 KEYSTORE_BASE64 KEYSTORE_B64 SIGNING_KEYSTORE_BASE64 SIGNING_KEYSTORE DEBUG_KEYSTORE_BASE64 ANDROID_KEYSTORE KEYSTORE KEYSTORE_FILE_BASE64 RELEASE_KEYSTORE_BASE64 ANDROID_SIGNING_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD KEYSTORE_PASSWORD ANDROID_KEY_ALIAS KEY_ALIAS ANDROID_KEY_PASSWORD KEY_PASSWORD STORE_PASSWORD KEYSTORE_PASS KEY_PASS SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            value="${!name}"
            if [ -n "$value" ]; then result=present; else result=absent; fi
            echo "$name=$result"
          done

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in admin.js app.js collections.js config.js perfumeria.js ui.js; do
            echo "Checking $file"
            node --check "$file"
          done
          echo "Checking Cloudflare Pages Function syntax"
          node --input-type=module --check < functions/api/share.js
      - name: Test Cloudflare Pages share endpoint
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --test tests/cloudflare-share.test.mjs

      - name: Check canonical URLs and public share origin
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          root = Path(".")
          required = {
              "config.js": 'publicCatalogUrl: "https://jb-collections.pages.dev"',
              "index.html": 'href="https://jb-collections.pages.dev/"',
              "tecnologia/index.html": 'href="https://jb-collections.pages.dev/tecnologia/"',
              "perfumeria/index.html": 'href="https://jb-collections.pages.dev/perfumeria/"',
              "functions/api/share.js": "export async function onRequest",
          }
          errors = []
          for filename, needle in required.items():
              content = (root / filename).read_text(encoding="utf-8")
              if needle not in content:
                  errors.append(f"{filename}: required configuration missing: {needle}")
          for filename in ("tecnologia/index.html", "perfumeria/index.html", "perfumeria.html"):
              if "jasbh121101.github.io/Cat-logo/" in (root / filename).read_text(encoding="utf-8"):
                  errors.append(f"{filename}: old GitHub Pages URL remains")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("Public URL, canonical links, and Cloudflare Functions entry point are consistent.")
          PY

      - name: Check HTML IDs and local references
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import posixpath
          import sys

          root = Path(".")
          failures = []

          class Checker(HTMLParser):
              def __init__(self, filename):
                  super().__init__(convert_charrefs=True)
                  self.filename = filename
                  self.ids = set()

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  element_id = attrs.get("id")
                  if element_id:
                      if element_id in self.ids:
                          failures.append(f"{self.filename}: duplicate id={element_id!r}")
                      self.ids.add(element_id)

                  for attribute in ("src", "href", "poster"):
                      value = attrs.get(attribute)
                      if not value:
                          continue
                      value = value.strip()
                      if (value.startswith("#") or value.startswith("//")
                              or value.startswith("/") or value.startswith("data:")):
                          continue
                      parsed = urlsplit(value)
                      if parsed.scheme or parsed.netloc:
                          continue
                      relative = parsed.path
                      if not relative:
                          continue
                      base = str(self.filename.parent / relative)
                      resolved = Path(posixpath.normpath(base))
                      if relative.endswith("/") or (resolved.exists() and resolved.is_dir()):
                          resolved = resolved / "index.html"
                      if not resolved.exists():
                          failures.append(
                              f"{self.filename}: {attribute}={value!r} resolves to missing {resolved}"
                          )

          html_files = sorted(root.rglob("*.html"))
          for filename in html_files:
              checker = Checker(filename)
              try:
                  checker.feed(filename.read_text(encoding="utf-8"))
                  checker.close()
              except Exception as exc:
                  failures.append(f"{filename}: HTML parse error: {exc}")

          if failures:
              print("\\n".join(failures))
              sys.exit(1)
          print(f"Checked {len(html_files)} HTML files: no duplicate IDs or missing relative references.")
          PY
      - name: Check CSS block delimiters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          failures = []
          css_files = sorted(Path(".").rglob("*.css"))
          for path in css_files:
              text = path.read_text(encoding="utf-8")
              depth = 0
              state = "code"
              i = 0
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""
                  if state == "comment":
                      if c == "*" and n == "/":
                          state = "code"
                          i += 2
                          continue
                      i += 1
                      continue
                  if state in ("single", "double"):
                      end = "'" if state == "single" else '"'
                      if c == "\\\\":
                          i += 2
                          continue
                      if c == end:
                          state = "code"
                      i += 1
                      continue
                  if c == "/" and n == "*":
                      state = "comment"
                      i += 2
                      continue
                  if c == "'":
                      state = "single"
                  elif c == '"':
                      state = "double"
                  elif c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth < 0:
                          failures.append(f"{path}: unexpected closing brace at offset {i}")
                          break
                  i += 1
              if depth != 0 or state != "code":
                  failures.append(f"{path}: unbalanced CSS blocks/quotes (depth={depth}, state={state})")

          if failures:
              print("\\n".join(failures))
              sys.exit(1)
          print(f"Checked {len(css_files)} CSS files: braces and quoted strings are balanced.")
          PY
