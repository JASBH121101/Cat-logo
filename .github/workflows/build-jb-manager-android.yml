name: Build JB Manager Collections APK

on:
  push:
    branches:
      - feature/jb-manager-android-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Prepare a self-contained admin web bundle
        run: node mobile/prepare-web.mjs

      - name: Create Android project
        working-directory: mobile
        run: npx cap add android

      - name: Generate the JB Manager app icon and splash resources
        working-directory: mobile
        run: >
          npx @capacitor/assets generate --android --assetPath assets
          --iconBackgroundColor '#11172a'
          --iconBackgroundColorDark '#11172a'
          --splashBackgroundColor '#11172a'
          --splashBackgroundColorDark '#11172a'

      - name: Sync web assets into Android
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JB-Manager-Collections-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo "## JB Manager Collections"
            echo ""
            echo "The Android debug APK was built successfully."
            echo ""
            echo "Download the **JB-Manager-Collections-APK** artifact from this workflow run."
            echo "The APK is unsigned for store distribution but can be installed directly on a personal Android device."
          } >> "$GITHUB_STEP_SUMMARY"
