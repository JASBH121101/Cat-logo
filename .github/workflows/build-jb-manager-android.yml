      - name: Verify native updater source, manifest and package identity
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN="mobile/android/app/src/main/java/com/jbcollections/manager/v2/ApkUpdaterPlugin.java"
          MANIFEST="mobile/android/app/src/main/AndroidManifest.xml"
          test -f "$PLUGIN"
          grep -q 'EXPECTED_PACKAGE = "com.jbcollections.manager.v2"' "$PLUGIN"
          grep -q 'validateDownloadedApk' "$PLUGIN"
          grep -q 'sameHashSet' "$PLUGIN"
          grep -q 'clearObsoleteDownloadIfInstalledVersionIsNewer' "$PLUGIN"
          grep -q 'api/download/apk?version=' mobile/prepare-web.mjs
          grep -q 'REQUEST_INSTALL_PACKAGES' "$MANIFEST"
          grep -q 'applicationId "com.jbcollections.manager.v2"' mobile/android/app/build.gradle || {
            echo "Unexpected Android applicationId." >&2
            exit 1
          }
          grep -q 'registerPlugin(ApkUpdaterPlugin.class)' mobile/android/app/src/main/java/com/jbcollections/manager/v2/MainActivity.java || {
            echo "Native APK updater plugin is not registered in MainActivity." >&2
            exit 1
          }
          echo "Native updater source and package identity checks passed."

      - name: Verify JARVIS Go Partners screen scanner wiring
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="mobile/android/app/src/main/AndroidManifest.xml"
          MAIN="mobile/android/app/src/main/java/com/jbcollections/manager/v2/MainActivity.java"
          GRADLE="mobile/android/app/build.gradle"
          PLUGIN="mobile/android/app/src/main/java/com/jbcollections/manager/v2/GoPartnersScannerPlugin.java"
          SERVICE="mobile/android/app/src/main/java/com/jbcollections/manager/v2/GoPartnersCaptureService.java"
          test -s "$PLUGIN"
          test -s "$SERVICE"
          grep -q 'registerPlugin(GoPartnersScannerPlugin.class)' "$MAIN"
          grep -q 'FOREGROUND_SERVICE_MEDIA_PROJECTION' "$MANIFEST"
          grep -q 'foregroundServiceType="mediaProjection"' "$MANIFEST"
          grep -q 'android:exported="false"' "$MANIFEST"
          grep -q 'GoPartnersCaptureService' "$MANIFEST"
          grep -q 'com.google.mlkit:text-recognition:16.0.1' "$GRADLE"
          grep -q 'TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)' "$SERVICE"
          grep -q 'MAX_OBSERVATIONS = 80' "$SERVICE"
          echo "JARVIS screen scanner, MediaProjection foreground service, and bundled on-device OCR are wired into the APK."
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JB-Manager-Collections-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk JB-Manager-Collections.apk
          TAG="jb-manager-v1.0.$GITHUB_RUN_NUMBER"
          gh release create "$TAG" JB-Manager-Collections.apk \
            --title "JB Manager Collections v1.0.$GITHUB_RUN_NUMBER" \
            --notes "Update for JB Manager Collections. Download and install the APK on Android; the system will ask you to confirm installation." \
            --prerelease

      - name: Verify freshly published APK over GitHub and Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          version="1.0.${GITHUB_RUN_NUMBER}"
          direct_url="https://github.com/JASBH121101/Cat-logo/releases/download/jb-manager-v${version}/JB-Manager-Collections.apk"
          proxy_url="https://jb-collections.pages.dev/api/download/apk?version=${version}"
          for source in direct proxy; do
            if [ "$source" = "direct" ]; then url="$direct_url"; else url="$proxy_url"; fi
            headers="$RUNNER_TEMP/jb-apk-latest-${source}.headers"
            body="$RUNNER_TEMP/jb-apk-latest-${source}.apk"
            status="$(curl --silent --show-error --location --max-time 120 \
              --dump-header "$headers" --output "$body" --write-out "%{http_code}" "$url")"
            size="$(wc -c < "$body" | tr -d ' ')"
            echo "$source latest APK: HTTP $status, $size bytes, version $version"
            if [ "$status" != "200" ]; then
              echo "$source latest download did not return HTTP 200." >&2
              head -c 1200 "$body" >&2 || true
              exit 1
            fi
            if [ "$source" = "proxy" ]; then
              grep -Eiq '^content-type: application/vnd[.]android[.]package-archive' "$headers" || {
                echo "Cloudflare did not return the expected APK MIME type." >&2
                exit 1
              }
            fi
            python3 - "$body" "$source" <<'PY'
          import sys, zipfile
          from pathlib import Path
          path, source = sys.argv[1], sys.argv[2]
          data = Path(path).read_bytes()
          print(f"{source} latest APK diagnostics: bytes={len(data)}, ZIP magic={data[:4].hex()}")
          if len(data) < 1_000_000 or len(data) > 52_428_800:
              raise SystemExit(f"{source} latest APK size is outside the expected limits")
          if not data.startswith(b"PK") or not zipfile.is_zipfile(path):
              raise SystemExit(f"{source} latest download is not a valid APK/ZIP")
          with zipfile.ZipFile(path) as archive:
              broken = archive.testzip()
              if broken:
                  raise SystemExit(f"{source} latest APK has a corrupt entry: {broken}")
          PY
          done
          echo "Freshly published APK passed direct and Cloudflare download integrity checks."

      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo "## JB Manager Collections"
            echo ""
            echo "The Android debug APK was built successfully."
            echo ""
            echo "Download the **JB-Manager-Collections-APK** artifact from this workflow run."
            echo "The APK is unsigned for store distribution but can be installed directly on a personal Android device."
